<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - Admin</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"></noscript>
  <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></noscript>
  <link rel="stylesheet" href="/css/super_admin_only.css?v=1">
  <link rel="stylesheet" href="/css/manager-theme.css?v=1">
  <link rel="stylesheet" href="/css/admin_notifications.css?v=1">
  <link rel="stylesheet" href="/css/admin_sidebar.css?v=1">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-icon">
        <img src="/images/eli-coffee-beans-dark.png" alt="" />
      </div>
      <div class="sidebar-brand-copy">
        <p class="sidebar-brand-name">ELI Coffee Events</p>
        <p class="sidebar-brand-role" id="sidebarRolePill">Loading...</p>
      </div>
    </div>

    <div class="sidebar-content">
      <nav class="sidebar-nav" id="adminNav" aria-label="Admin"></nav>

      <div class="sidebar-user">
        <a href="/admin/profile.html" class="sidebar-user-link" title="View profile">
          <div class="sidebar-avatar" id="sidebarAvatar">--</div>
          <div class="sidebar-user-copy">
            <p class="sidebar-user-name" id="sidebarName">Loading...</p>
            <p class="sidebar-user-role" id="sidebarRoleBottom">Manager</p>
          </div>
        </a>
        <button type="button" class="sidebar-logout-btn" id="logoutBtn" title="Logout" aria-label="Logout">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <main class="main">
    <section class="page-shell">

      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="/admin/dashboard.html">Dashboard</a>
        <span class="breadcrumb-sep">/</span>
        <span class="breadcrumb-current">Notifications</span>
      </nav>

      <div class="page-header">
        <div>
          <h1 class="page-title">Notifications <span class="admin-badge" id="adminBadge">Loading...</span></h1>
          <p class="page-sub">Updates about reservations, payments, and contracts.</p>
        </div>
      </div>

      <div class="card notif-page-card">
        <div class="notif-page-tabs-row">
          <div class="notif-page-tabs" role="tablist" aria-label="Notification views">
            <button type="button" class="chip active" data-filter="all" role="tab" aria-selected="true">All</button>
            <button type="button" class="chip" data-filter="unread" role="tab" aria-selected="false">
              Unread <span class="notif-page-count-pill" id="notifPageUnreadCount">0</span>
            </button>
          </div>
          <button type="button" class="notif-page-mark-all" id="notifPageMarkAll">Mark all as read</button>
        </div>

        <div class="notif-page-list" id="notifPageList">
          <p class="notif-page-loading-text">Loading notifications&hellip;</p>
        </div>

        <div class="notif-page-pagination" id="notifPagePagination"></div>
      </div>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.js" defer></script>
  <script type="module" src="/js/admin_notifications.js"></script>
</body>
</html>
