<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELI Coffee Events Management System</title>
    <link rel="stylesheet" href="../css/admin_login.css?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"></noscript>

</head>
<body>

    <div class="top-bar">ELI Coffee Events Management System</div>

    <div class="admin-page">
        <div class="admin-wrapper">

            <!-- Brand Mark -->
            <div class="brand-mark">
                <img src="../images/eli-coffee-beans-white.png" alt="ELI Coffee" class="brand-mark-logo" />
            </div>

            <!-- Welcome Header -->
            <div class="welcome-header" id="welcomeHeader">
                <h1>Welcome back</h1>
                <p>Sign in to manage events and reservations</p>
            </div>

            <!-- Login Card -->
            <div class="admin-card" id="loginCard">
                <form id="adminLoginForm">

                    <!-- Email -->
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="email@gmail.com"
                            required
                        />
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <div class="label-row">
                            <label for="password">Password</label>
                            <a href="/admin/forgot-password.html" class="forgot">Forgot password?</a>
                        </div>
                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                required
                            />
                            <button type="button" class="toggle-password" onclick="togglePassword()" title="Show/hide password">
                                <!-- Eye Icon -->
                                <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="login-btn">Sign in</button>

                    <div class="form-msg" id="formMsg"></div>
                </form>
            </div>

            <!-- MFA Verification Card -->
            <div class="admin-card" id="mfaCard" style="display:none">
                <div class="mfa-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                </div>
                <h2>Two-factor authentication</h2>
                <p class="subtitle">Open your authenticator app and enter the 6-digit code to continue.</p>

                <form id="mfaForm">
                    <div class="form-group">
                        <label for="mfaCode">Authentication code</label>
                        <input
                            type="text"
                            id="mfaCode"
                            name="mfaCode"
                            class="mfa-code-input"
                            placeholder="000000"
                            maxlength="6"
                            inputmode="numeric"
                            autocomplete="one-time-code"
                            required
                        />
                    </div>
                    <button type="submit" class="login-btn" id="mfaSubmitBtn">Verify and continue</button>
                    <div class="form-msg" id="mfaMsg"></div>
                </form>

                <hr class="divider">

                <button type="button" class="mfa-back-link" id="mfaBackBtn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                    Back to login
                </button>
            </div>

            <!-- Footer -->
            <p class="page-footer">Authorized staff only &middot; ELI Coffee Events Caf&eacute;</p>
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
                    <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                `;
            } else {
                input.type = 'password';
                icon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                `;
            }
        }

    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.js" defer></script>
    <script type="module" src="../js/admin_login.js"></script>

</body>
</html>
