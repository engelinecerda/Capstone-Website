<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create a New Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"></noscript>
  <link rel="stylesheet" href="/css/portal_password.css?v=1">
</head>
<body>
  <div class="top-bar">ELI Coffee Events Management System</div>

  <main class="portal-page">
    <section class="portal-card">
      <div class="portal-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 4l6 2.67V11c0 3.88-2.62 7.5-6 8.93C8.62 18.5 6 14.88 6 11V7.67L12 5z"/>
        </svg>
      </div>

      <div class="portal-copy">
        <p class="portal-eyebrow">Password Reset</p>
        <h1>Create a New Password</h1>
        <p class="portal-subtitle">
          Choose a new password for your account.
          <span>This page works only when opened from the reset email link.</span>
        </p>
      </div>

      <form class="portal-form" id="portal-reset-password-form">
        <div class="form-group">
          <label for="portal-new-password">New Password</label>
          <div class="password-wrapper">
            <input type="password" id="portal-new-password" placeholder="Enter new password" required>
            <button type="button" class="toggle-password" title="Show/hide password">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="portal-confirm-new-password">Confirm New Password</label>
          <div class="password-wrapper">
            <input type="password" id="portal-confirm-new-password" placeholder="Confirm new password" required>
            <button type="button" class="toggle-password" title="Show/hide password">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="portal-btn">Update Password</button>

        <p class="portal-link">
          Want to sign in instead? <a href="/admin/index.html">Back to Login</a>
        </p>

        <p class="form-msg" id="portal-reset-password-msg" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.js" defer></script>
  <script type="module" src="/js/portal_reset_password.js"></script>
</body>
</html>
