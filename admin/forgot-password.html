<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"></noscript>
  <link rel="stylesheet" href="/css/portal_password.css?v=1">
</head>
<body>
  <div class="top-bar">ELI Coffee Events Management System</div>

  <main class="portal-page">
    <section class="portal-card">
      <div class="portal-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 4l6 2.67V11c0 3.88-2.62 7.5-6 8.93C8.62 18.5 6 14.88 6 11V7.67L12 5z"/>
        </svg>
      </div>

      <div class="portal-copy">
        <p class="portal-eyebrow">Password Reset</p>
        <h1>Reset Your Password</h1>
        <p class="portal-subtitle">
          Enter the email address linked to your account.
          <span>We'll send a password reset link to your registered email.</span>
        </p>
      </div>

      <form class="portal-form" id="portal-forgot-password-form">
        <div class="form-group">
          <label for="portal-reset-email">Email Address</label>
          <input type="email" id="portal-reset-email" placeholder="your.email@example.com" required>
        </div>

        <button type="submit" class="portal-btn">Send Reset Link</button>

        <p class="portal-link">
          Remembered your password? <a href="/admin/index.html">Back to Login</a>
        </p>

        <p class="form-msg" id="portal-forgot-password-msg" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.js" defer></script>
  <script type="module" src="/js/portal_forgot_password.js"></script>
</body>
</html>
