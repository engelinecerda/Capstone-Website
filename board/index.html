<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operations Board - ELI Coffee Events</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/manager-theme.css">
  <link rel="stylesheet" href="/css/board.css">
</head>
<body class="board-body">
  <div class="board-shell" id="boardShell">
    <header class="board-header">
      <div class="board-brand">
        <div class="board-brand-icon">
          <img src="/images/eli-coffee-beans-dark.png" alt="" />
        </div>
        <div class="board-brand-copy">
          <p class="board-brand-name">ELI Coffee Events</p>
          <p class="board-brand-label">Operations Board</p>
        </div>
      </div>
      <div class="board-clock-wrap">
        <p class="board-clock" id="boardClock">--:--:--</p>
        <p class="board-date" id="boardDate">Loading...</p>
      </div>
    </header>

    <main class="board-main">
      <section class="board-today-panel">
        <div class="board-panel-head">
          <h2 class="board-panel-title">Today</h2>
          <p class="board-panel-sub" id="boardTodaySub">Loading schedule...</p>
        </div>
        <div class="board-today-list" id="boardTodayList"></div>
      </section>

      <aside class="board-week-rail">
        <div class="board-panel-head">
          <h2 class="board-panel-title">This Week</h2>
        </div>
        <div class="board-week-days" id="boardWeekDays"></div>
      </aside>
    </main>

    <footer class="board-footer">
      <span class="board-footer-device">Front Counter Display</span>
      <div class="board-footer-right">
        <span class="board-footer-status">
          <span class="board-status-dot" id="boardStatusDot"></span>
          <span id="boardFooterMessage">Connecting...</span>
        </span>
        <button type="button" class="board-logout-btn" id="boardLogoutBtn" title="Sign out this display" aria-label="Sign out this display">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
          <span>Sign out</span>
        </button>
      </div>
    </footer>
  </div>

  <div class="board-fullscreen-state hidden" id="boardSignedOutState">
    <div class="board-fullscreen-card">
      <i class="fa-solid fa-lock"></i>
      <h1>Signed out</h1>
      <p>Ask the administrator to sign this display back in.</p>
    </div>
  </div>

  <script type="module" src="/js/board.js"></script>
</body>
</html>
